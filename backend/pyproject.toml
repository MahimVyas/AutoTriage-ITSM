[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autotriage-itsm-backend"
version = "0.1.0"
description = "AutoTriage-ITSM — Enterprise AI-Augmented ITSM Ticketing & SLA Escalation Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AutoTriage-ITSM Team", email = "team@autotriage.dev"}]
keywords = ["itsm", "ticketing", "ai", "rag", "sla", "fastapi"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0",
    "celery>=5.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "structlog>=24.1",
    "openai>=1.40",
    "google-generativeai>=0.7",
    "pgvector>=0.3",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0"]

[project.scripts]
autotriage = "src.main:app"
autotriage-worker = "src.workers.sla_worker:celery_app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
