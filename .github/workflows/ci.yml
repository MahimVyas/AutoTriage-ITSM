name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend smoke tests (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests (SQLite, no keys required)
        run: python tests/test_smoke.py

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vite build
        run: npx vite build

  docker-images:
    name: Docker images build (dev + prod compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate dev compose file
        run: docker compose -f docker-compose.yml config -q

      - name: Validate prod compose file
        run: docker compose -f docker-compose.prod.yml config -q

      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build

      - name: Boot stack and check health
        run: |
          docker compose -f docker-compose.prod.yml up -d
          timeout 180 bash -c '
            until curl -fsS http://localhost:5173/api/health > /dev/null; do
              sleep 5
            done
          '
          echo "API health: $(curl -fsS http://localhost:5173/api/health)"
          echo "UI: $(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:5173/)"

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
